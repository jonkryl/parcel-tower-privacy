name: Publish privacy policy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare the policy page
        run: |
          mkdir -p "${{ runner.temp }}/parcel-privacy-site"
          cp index.html "${{ runner.temp }}/parcel-privacy-site/index.html"
      - name: Upload the page artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/parcel-privacy-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the page
        id: deployment
        uses: actions/deploy-pages@v5
